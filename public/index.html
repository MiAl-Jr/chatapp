<!DOCTYPE html>
<html>
<head>
    <title>Chat App</title>

    <style>
        body {
            font-family: Arial;
            display: flex;
            max-width: 900px;
            margin: auto;
        }

        #users {
            width: 25%;
            border-right: 1px solid #ccc;
            padding: 10px;
        }

        #chat {
            width: 75%;
            padding: 10px;
        }

        #messages {
            list-style: none;
            padding: 0;
            height: 350px;
            overflow-y: auto;
        }

        #messages li {
            background: #f2f2f2;
            margin-bottom: 5px;
            padding: 6px;
            border-radius: 5px;
        }

        .status {
            font-size: 10px;
            color: gray;
        }

        #typing {
            font-size: 12px;
            color: gray;
            height: 20px;
        }

        .online {
            color: green;
        }
    </style>
</head>
<body>

<!-- USERS -->
<div id="users">
    <h3>Online 🟢</h3>
    <ul id="userList"></ul>
</div>

<!-- CHAT -->
<div id="chat">
    <h2>Chat</h2>

    <ul id="messages"></ul>
    <p id="typing"></p>

    <input id="input" placeholder="Type message..." />
    <button onclick="send()">Send</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();

    const input = document.getElementById("input");
    const messages = document.getElementById("messages");
    const typingBox = document.getElementById("typing");
    const userList = document.getElementById("userList");

    let name = prompt("Enter your name:");
    socket.emit("join", name);

    let messageId = 0;
    let typingTimeout;

    // SEND MESSAGE
    function send() {
        if (input.value.trim() !== "") {

            const id = Date.now() + "-" + messageId++;

            socket.emit("chat message", {
                msg: input.value,
                id: id,
                name: name
            });

            addMessage(name, input.value, id, "sent");

            input.value = "";
            socket.emit("stop typing", name);
        }
    }

    // ENTER KEY
    input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") send();
    });

    // ADD MESSAGE
    function addMessage(sender, text, id, status) {
        const li = document.createElement("li");

        li.innerHTML = 
            <b>${sender}:</b> ${text}
            <div class="status" id="status-${id}">
                ${getStatus(status)}
            </div>
        ;

        messages.appendChild(li);
    }

    function getStatus(status) {
        if (status === "sent") return "✓ Sent";
        if (status === "delivered") return "✓✓ Delivered";
        if (status === "seen") return "✓✓ Seen";
        return "";
    }

    // RECEIVE MESSAGE
    socket.on("chat message", (data) => {
        addMessage(data.name, data.msg, data.id, "delivered");

        socket.emit("message seen", data.id);
    });

    // DELIVERED
    socket.on("message delivered", (id) => {
        const el = document.getElementById("status-" + id);
        if (el) el.innerText = "✓✓ Delivered";
    });

    // SEEN
    socket.on("message seen", (id) => {
        const el = document.getElementById("status-" + id);
        if (el) el.innerText = "✓✓ Seen";
    });

    // TYPING
    input.addEventListener("input", () => {
        socket.emit("typing", name);

        clearTimeout(typingTimeout);

        typingTimeout = setTimeout(() => {
            socket.emit("stop typing", name);
        }, 800);
    });

    let typingUsers = new Set();

    socket.on("typing", (user) => {
        typingUsers.add(user);
        updateTyping();
    });

    socket.on("stop typing", (user) => {
        typingUsers.delete(user);
        updateTyping();
    });

    function updateTyping() {
        typingBox.textContent =
            typingUsers.size > 0
                ? [...typingUsers].join(", ") + " typing..."
                : "";
    }
// ONLINE USERS
    socket.on("user list", (users) => {
        userList.innerHTML = "";

        users.forEach(u => {
            const li = document.createElement("li");
            li.innerHTML = "🟢 " + u;
            userList.appendChild(li);
        });
    });
</script>

</body>
</html>
