<!DOCTYPE html>
<html>
<head>
    <title>My Chat App</title>
    <style>
        body {
            font-family: Arial;
            display: flex;
            max-width: 800px;
            margin: auto;
        }

        #left {
            width: 30%;
            border-right: 1px solid #ccc;
            padding: 10px;
        }

        #right {
            width: 70%;
            padding: 10px;
        }

        #messages {
            list-style: none;
            padding: 0;
            height: 300px;
            overflow-y: scroll;
        }

        #typing {
            color: gray;
            font-size: 12px;
            height: 20px;
        }

        .online {
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

<!-- LEFT: ONLINE USERS -->
<div id="left">
    <h3>Online Users 🟢</h3>
    <ul id="users"></ul>
</div>

<!-- RIGHT: CHAT -->
<div id="right">
    <h2>Chat</h2>

    <ul id="messages"></ul>
    <p id="typing"></p>

    <input id="input" placeholder="Type message..." />
    <button onclick="send()">Send</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    // ask notification permission
if (Notification.permission !== "granted") {
    Notification.requestPermission();
}

// receive admin alert
socket.on("special user joined", (name) => {

    // browser notification
    if (Notification.permission === "granted") {
        new Notification("Chat Alert", {
            body: name + " joined the chat!"
        });
    }

});
    const socket = io();

    const input = document.getElementById("input");
    const messages = document.getElementById("messages");
    const typingBox = document.getElementById("typing");
    const usersBox = document.getElementById("users");

    let name = prompt("Enter your name:");
    socket.emit("join", name);

    let typingTimeout;

    // SEND MESSAGE
    function send() {
        if (input.value.trim() !== "") {
            socket.emit("chat message", name + ": " + input.value);
            input.value = "";
            socket.emit("stop typing", name);
        }
    }

    // ENTER KEY SEND
    input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") send();
    });

    // RECEIVE MESSAGE
    socket.on("chat message", (msg) => {
        const li = document.createElement("li");
        li.textContent = msg;
        messages.appendChild(li);
    });

    // TYPING
    input.addEventListener("input", () => {
        socket.emit("typing", name);

        clearTimeout(typingTimeout);

        typingTimeout = setTimeout(() => {
            socket.emit("stop typing", name);
        }, 800);
    });

    let typingUsers = new Set();

    socket.on("typing", (user) => {
        typingUsers.add(user);
        updateTyping();
    });

    socket.on("stop typing", (user) => {
        typingUsers.delete(user);
        updateTyping();
    });

    function updateTyping() {
        typingBox.textContent =
            typingUsers.size > 0
                ? [...typingUsers].join(", ") + " typing..."
                : "";
    }

    // 🟢 ONLINE USERS LIST (NEW FEATURE)
    socket.on("user list", (users) => {
        usersBox.innerHTML = "";

        users.forEach(u => {
            const li = document.createElement("li");
            li.textContent = "🟢 " + u;
            usersBox.appendChild(li);
        });
    });
    function clearChat() {

    // clear all chat messages
    messages.innerHTML = "";

    // optional popup
    alert("Chat cleared!");

    // redirect to YouTube
    window.location.href = "https://youtube.com";
}
</script>

</body>
</html>
