<!DOCTYPE html>
<html>
<head>
    <title>GITHUB</title>
    <style>
        body {
    font-family: Arial;
    max-width: 500px;
    margin: auto;
    background: url("https://images.alphacoders.com/137/thumb-1920-1370166.png");
    background-size: cover;
    background-position: center;
    color: white;
}
        body {
            font-family: Arial;
            max-width: 500px;
            margin: auto;
        }

        #messages {
            list-style: none;
            padding: 0;
        }

        #messages li {
            padding: 5px;
        }

        #typing {
            color: gray;
            font-size: 13px;
            height: 20px;
        }

        input {
            width: 70%;
            padding: 8px;
        }

        button {
            padding: 8px;
        }
    </style>
</head>
<body>

<h2>GITHUB</h2>

<ul id="messages"></ul>
<p id="typing"></p>

<input id="input" placeholder="Type message..." autocomplete="off" />
<button id="sendBtn">Send</button>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();

    const input = document.getElementById("input");
    const messages = document.getElementById("messages");
    const typingBox = document.getElementById("typing");
    const sendBtn = document.getElementById("sendBtn");

    let name = prompt("Enter your name:");
    let typingTimeout;

    // SEND MESSAGE FUNCTION
    function sendMessage() {
        if (input.value.trim() !== "") {
            socket.emit("chat message", name + ": " + input.value);
            input.value = "";
            socket.emit("stop typing", name);
        }
    }

    // BUTTON CLICK SEND
    sendBtn.addEventListener("click", sendMessage);

    // ⭐ ENTER KEY SEND (NEW FEATURE)
    input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            e.preventDefault();
            sendMessage();
        }
    });

    // RECEIVE MESSAGE
    socket.on("chat message", (msg) => {
        const li = document.createElement("li");
        li.textContent = msg;
        messages.appendChild(li);
    });

    // TYPING
    input.addEventListener("input", () => {
        socket.emit("typing", name);

        clearTimeout(typingTimeout);

        typingTimeout = setTimeout(() => {
            socket.emit("stop typing", name);
        }, 800);
    });

    let typingUsers = new Set();

    socket.on("typing", (user) => {
        typingUsers.add(user);
        updateTyping();
    });

    socket.on("stop typing", (user) => {
        typingUsers.delete(user);
        updateTyping();
    });

    function updateTyping() {
        if (typingUsers.size === 0) {
            typingBox.textContent = "";
        } else {
            typingBox.textContent = [...typingUsers].join(", ") + " is typing...";
        }
    }
</script>

</body>
</html>
